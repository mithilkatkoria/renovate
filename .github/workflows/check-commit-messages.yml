name: Check Commit Messages

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  discussions: read
  issues: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  closes-issue-or-discussion:
    runs-on: ubuntu-slim
    steps:
      - name: Check for closing keywords that would close a Discussion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Co-authored-by: Claude Sonnet 4.5 (GitHub Copilot)

            // Get all commits in this PR using the GitHub API
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // GitHub honours closing keywords in both commit messages and the
            // PR description. `#123` may refer to a Discussion rather than an
            // Issue - since Issues and Discussions are numbered independently
            // - and closing keywords must not auto-close a Discussion (see
            // #45439, which unintentionally closed discussion #40885).
            // Matches: closes #123, fixes #123, closes: #123, etc.
            const closingPattern = /(closes|fixes|resolves|fixed|closed|resolved):?\s+#(\d+)/gi;

            // Collect every closing-keyword reference, keeping one example
            // line per source for the error report.
            const references = new Map(); // number -> { source, line }
            const collect = (text, source) => {
              for (const match of text.matchAll(closingPattern)) {
                const number = match[2];
                if (!references.has(number)) {
                  const line = text.slice(0, match.index).split('\n').length;
                  const lineText = text.split('\n')[line - 1].trim();
                  references.set(number, { source, line: lineText });
                }
              }
            };

            for (const commit of commits) {
              const shortSha = commit.sha.substring(0, 7);
              collect(commit.commit.message, `commit ${shortSha}`);
            }
            collect(context.payload.pull_request.body ?? '', 'PR description');

            // Only fail for references that resolve to a Discussion - an
            // Issue reference is the intended, supported use of these
            // keywords (see the PR template).
            const violations = [];
            for (const [number, { source, line }] of references) {
              let isIssue = true;
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(number),
                });
              } catch (err) {
                if (err.status !== 404) throw err;
                isIssue = false;
              }
              if (isIssue) continue;

              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) { id }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: Number(number) },
              );
              if (repository.discussion) {
                violations.push({ source, line });
              }
            }

            // Report results
            if (violations.length > 0) {
              let errorMessage = `Found ${violations.length} closing keyword(s) referencing a Discussion:\n\n`;
              for (const violation of violations) {
                errorMessage += `- ${violation.source}: ${violation.line}\n`;
              }
              errorMessage += `\nClosing keywords (closes, fixes, resolves, etc.) must not reference a Discussion, as merging would auto-close it. Reference the discussion without a closing keyword instead, e.g. 'Related discussion: #123'.`;
              core.setFailed(errorMessage);
            } else {
              core.info('✓ No closing keywords referencing a Discussion found');
            }

  # Runs a full `semantic-release` dry-run for the state that would exist right
  # after this PR merges, and fails if it would publish a new *major* version.
  # Major releases are prepared deliberately (see docs/development/major-release.md),
  # so when a major bump is intended, override this check manually.
  dry-run-major:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          # semantic-release needs the full history and all tags to find the
          # previous release and the commits since it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
          os: ${{ runner.os }}

      - name: Full semantic-release dry-run
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `tools/check-release-dry-run.ts` runs a full `semantic-release` dry-run
          # via its programmatic API and inspects the returned `nextRelease.type`.
          # A real release needs a writable remote and GitHub-authenticating plugins
          # - neither is available for fork PRs - so the run is fully offline:
          #   * a local bare mirror stands in for the remote (no network, no token);
          #   * only the analysis plugins run (see the script); dropping the publish
          #     plugins does not change the computed version;
          #   * it is presented as a push to the base branch at the merge commit,
          #     i.e. exactly the state that would exist right after this PR merges.

          # Only main / next / maint/* ever publish a release.
          case "$BASE_REF" in
            main | next | maint/*) ;;
            *)
              echo "Base branch '$BASE_REF' is not a release branch; skipping."
              exit 0
              ;;
          esac

          # The checkout is a detached merge commit; semantic-release runs
          # `git tag --merged <baseRef>`, so the base ref must exist locally.
          git branch -f "$BASE_REF" "$HEAD_SHA"

          mirror="$RUNNER_TEMP/release-mirror.git"
          git clone --bare --quiet . "$mirror"
          # Pin the mirror's base branch to the PR base so the checked-out merge
          # commit is strictly ahead of it (semantic-release treats it as releasable).
          git -C "$mirror" branch -f "$BASE_REF" "$BASE_SHA"

          node tools/check-release-dry-run.ts "file://$mirror" "$BASE_REF" "$HEAD_SHA"
